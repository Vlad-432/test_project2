name: Build CryptoScreen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Install screen capture web UI
        run: |
          cp screen-capture.js www/screen-capture.js

          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")

          tag = '<script src="screen-capture.js"></script>'

          if tag not in s:
              if "</body>" in s:
                  s = s.replace("</body>", tag + "\n</body>", 1)
              else:
                  s += "\n" + tag

              p.write_text(s, encoding="utf-8")
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Install native screen capture module
        run: |
          mkdir -p /tmp/screen-module

          unzip CryptoScreen_ScreenCapture_Module_v2.zip -d /tmp/screen-module

          DEST="android/app/src/main/java/com/myapp/generated"

          mkdir -p "$DEST"

          cp /tmp/screen-module/com/myapp/generated/*.java "$DEST/"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />'
          ]

          for item in permissions:
              name = item.split('"')[1]
              if name not in s:
                  s = s.replace('<application', item + '\n    <application', 1)

          service = '''
              <service
                  android:name="com.myapp.generated.ScreenCaptureService"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection" />
          '''

          if "ScreenCaptureService" not in s:
              s = s.replace('</application>', service + '\n</application>', 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Generate app icons
        run: |
          if [ -f resources/icon.png ]; then
            npx @capacitor/assets generate --android
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoScreen-ScreenCapture-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
